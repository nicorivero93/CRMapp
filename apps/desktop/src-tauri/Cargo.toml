[package]
name = "mycrm-desktop"
version = "0.1.0"
description = "MyCRM Local Edition desktop wrapper"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mycrm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
